<script>
/* ============================================================
   Script.html — 管理画面の操作（ブラウザ側JavaScript）
   通常は編集不要です。
   ============================================================ */
(function () {
  'use strict';

  // ---------- 小さな共通部品 ----------

  function $(id) { return document.getElementById(id); }

  // HTMLに安全に文字列を出すためのエスケープ
  function esc(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function showLoading(on) { $('loading').classList.toggle('hidden', !on); }

  var toastTimer = null;
  function showToast(message, isError) {
    var t = $('toast');
    t.textContent = message;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 4000);
  }

  // サーバー側エラーの共通表示
  function fail(err) {
    showLoading(false);
    var msg = (err && err.message) ? err.message : String(err || 'エラーが発生しました');
    showToast(msg, true);
  }

  // サーバー関数を呼び出すヘルパー（ローディング表示つき）
  function run(serverFn, args, onDone) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(function (result) {
        showLoading(false);
        onDone(result);
      })
      .withFailureHandler(fail)
      [serverFn](args);
  }

  // クリップボードコピー（失敗時は手動コピーを促す）
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast('コピーしました。');
      }, function () {
        window.prompt('下の文字列を手動でコピーしてください:', text);
      });
    } else {
      window.prompt('下の文字列を手動でコピーしてください:', text);
    }
  }

  // ---------- タブ切り替え ----------

  var tabButtons = document.querySelectorAll('.tab');
  Array.prototype.forEach.call(tabButtons, function (btn) {
    btn.addEventListener('click', function () {
      Array.prototype.forEach.call(tabButtons, function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var panels = document.querySelectorAll('.panel');
      Array.prototype.forEach.call(panels, function (p) { p.classList.remove('active'); });
      $('tab-' + btn.getAttribute('data-tab')).classList.add('active');
    });
  });

  // ---------- ① グループ設定 ----------

  function renderGroup(s) {
    $('group-name').value = s.group_name || '';
    $('admin-email').value = s.admin_email || '';
    $('timezone').value = s.timezone || 'Asia/Tokyo';
    $('group-id').textContent = s.group_id || '—';
    $('system-version').textContent = s.system_version || '—';
  }

  $('form-group').addEventListener('submit', function (ev) {
    ev.preventDefault();
    run('saveGroupSettings', {
      group_name: $('group-name').value,
      admin_email: $('admin-email').value,
      timezone: $('timezone').value
    }, function (res) {
      renderGroup(res.settings || {});
      showToast(res.message || '保存しました。');
    });
  });

  // ---------- ② 店舗管理 ----------

  var currentStores = [];

  function renderStores(stores) {
    currentStores = stores || [];
    var tbody = $('stores-tbody');
    tbody.innerHTML = '';
    $('stores-empty').classList.toggle('hidden', currentStores.length > 0);
    currentStores.forEach(function (s) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + esc(s.store_id) + '</td>' +
        '<td>' + esc(s.store_name) + '</td>' +
        '<td>' + esc(s.phone) + '</td>' +
        '<td>' + (s.status === 'suspended' ? '<span class="badge off">利用停止</span>' : '<span class="badge ok">稼働中</span>') + '</td>' +
        '<td class="cell-actions">' +
          '<button type="button" class="btn small" data-act="edit" data-id="' + esc(s.store_id) + '">編集</button>' +
          (s.status === 'suspended'
            ? '<button type="button" class="btn small" data-act="activate" data-id="' + esc(s.store_id) + '" data-name="' + esc(s.store_name) + '">稼働へ戻す</button>'
            : '<button type="button" class="btn small danger" data-act="suspend" data-id="' + esc(s.store_id) + '" data-name="' + esc(s.store_name) + '">利用停止</button>') +
        '</td>';
      tbody.appendChild(tr);
    });
  }

  function refreshStores(res) {
    renderStores(res.stores || []);
    showToast(res.message || '更新しました。');
  }

  $('stores-tbody').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');
    var name = btn.getAttribute('data-name') || '';

    if (act === 'edit') {
      var s = currentStores.filter(function (x) { return x.store_id === id; })[0];
      if (s) openStoreModal(s);
      return;
    }
    if (act === 'suspend') {
      if (!confirm('「' + name + '」を利用停止にしますか？\n（データは消えません）')) return;
      run('setStoreStatus', { store_id: id, status: 'suspended' }, refreshStores);
      return;
    }
    if (act === 'activate') {
      run('setStoreStatus', { store_id: id, status: 'active' }, refreshStores);
    }
  });

  // 店舗の追加・編集モーダル
  function openStoreModal(store) {
    $('modal-title').textContent = store ? '店舗を編集（' + store.store_id + '）' : '店舗を追加';
    $('store-id').value = store ? store.store_id : '';
    $('store-name').value = store ? store.store_name : '';
    $('store-address').value = store ? store.address : '';
    $('store-phone').value = store ? store.phone : '';
    $('store-hours').value = store ? store.business_hours : '';
    $('modal-store').classList.remove('hidden');
  }

  function closeStoreModal() { $('modal-store').classList.add('hidden'); }

  $('btn-new-store').addEventListener('click', function () { openStoreModal(null); });
  $('modal-cancel').addEventListener('click', closeStoreModal);
  $('modal-store').addEventListener('click', function (ev) {
    if (ev.target === $('modal-store')) closeStoreModal();
  });

  $('form-store').addEventListener('submit', function (ev) {
    ev.preventDefault();
    run('saveStore', {
      store_id: $('store-id').value,
      store_name: $('store-name').value,
      address: $('store-address').value,
      phone: $('store-phone').value,
      business_hours: $('store-hours').value
    }, function (res) {
      closeStoreModal();
      refreshStores(res);
    });
  });

  // ---------- ③ LINE接続 ----------

  function renderLine(st) {
    var state = st.connection_status || 'disconnected';
    var badge = $('line-badge');
    if (state === 'connected') {
      badge.textContent = '接続済み';
      badge.className = 'badge ok';
    } else if (state === 'error') {
      badge.textContent = 'エラー（要再設定）';
      badge.className = 'badge ng';
    } else {
      badge.textContent = '未接続';
      badge.className = 'badge off';
    }
    $('line-last-checked').textContent = st.last_checked_at || '—';
    $('line-channel-id-view').textContent = st.channel_id || '—';
    $('line-bot-user-id').textContent = st.bot_user_id || '—';
  }

  function onLineResult(res) {
    renderLine(res.status || {});
    if (res.bot) {
      $('line-bot-name').textContent = res.bot.display_name || '—';
      $('line-bot-basic-id').textContent = res.bot.basic_id || '—';
    }
    $('line-error-guide').classList.toggle('hidden', !!res.ok);
    showToast(res.message || '処理しました。', !res.ok);
  }

  $('form-line').addEventListener('submit', function (ev) {
    ev.preventDefault();
    run('saveLineSettingsAndTest', {
      channel_id: $('line-channel-id').value,
      access_token: $('line-token').value
    }, function (res) {
      $('line-token').value = ''; // 入力欄は常に空に戻す（画面に残さない）
      onLineResult(res);
    });
  });

  $('btn-retest').addEventListener('click', function () {
    run('testLineConnection', {}, onLineResult);
  });

  $('btn-disconnect').addEventListener('click', function () {
    if (!confirm('保存済みのトークンを削除してLINE接続を初期化します。よろしいですか？')) return;
    run('disconnectLine', {}, function (res) {
      $('line-bot-name').textContent = '—';
      $('line-bot-basic-id').textContent = '—';
      onLineResult(res);
    });
  });

  // Webhook連携カード（Cloudflare Workersに登録する2つの値）
  run('getWebhookSetupInfo', {}, function (info) {
    $('webhook-gas-url').textContent = info.gas_web_app_url || '（URLの取得に失敗しました。手順5でコピーしたWebアプリURLをお使いください）';
    $('webhook-shared-key').textContent = info.shared_key || '—';
  });

  $('btn-copy-shared-key').addEventListener('click', function () {
    copyText($('webhook-shared-key').textContent);
  });

  // ---------- ④ 顧客台帳 ----------

  var currentCustomers = [];

  function renderCustomers(payload) {
    currentCustomers = (payload && payload.customers) || [];
    var stats = (payload && payload.stats) || { total: 0, followed: 0 };
    $('customers-stats').textContent = '合計 ' + stats.total + '人（友だち ' + stats.followed + '人）';
    filterCustomers();
  }

  function filterCustomers() {
    var q = ($('customer-search').value || '').trim().toLowerCase();
    var tbody = $('customers-tbody');
    tbody.innerHTML = '';
    var shown = 0;
    currentCustomers.forEach(function (c) {
      var hay = (c.display_name + ' ' + c.customer_id + ' ' + c.line_user_id).toLowerCase();
      if (q && hay.indexOf(q) === -1) return;
      shown++;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + esc(c.customer_id) + '</td>' +
        '<td>' + esc(c.display_name || '(未取得)') + '</td>' +
        '<td>' + (c.friend_status === 'unfollowed' ? '<span class="badge off">解除済み</span>' : '<span class="badge ok">友だち</span>') + '</td>' +
        '<td>' + fmtDateTime(c.joined_at) + '</td>' +
        '<td>' + fmtDateTime(c.last_interaction_at) + '</td>';
      tbody.appendChild(tr);
    });
    $('customers-empty').classList.toggle('hidden', shown > 0);
  }

  $('customer-search').addEventListener('input', filterCustomers);

  $('btn-import-followers').addEventListener('click', function () {
    if (!confirm('LINE公式アカウントの友だち全員を顧客台帳に取り込みます。\n人数によっては1〜2分かかります。実行しますか？')) return;
    run('importFollowers', {}, function (res) {
      renderCustomers(res);
      showToast(res.message || '取り込みました。');
    });
  });

  // ---------- ⑤ 予約管理 ----------

  var RES_STATUS_LABEL = {
    reserved: '<span class="badge ok">予約済み</span>',
    visited: '<span class="badge info">来店済み</span>',
    cancelled: '<span class="badge off">キャンセル</span>',
    no_show: '<span class="badge ng">無断キャンセル</span>'
  };

  var currentReservations = [];
  var ledgerCustomers = [];

  function pad2(n) { return ('0' + n).slice(-2); }
  function todayLocal() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  // 日時の表示を「2026/10/26 19:00」の短い形にそろえる（秒・GMT表記なし）
  function fmtDateTime(v) {
    if (!v) return '—';
    var s = String(v).replace(' (日本標準時)', '').replace(' GMT+0900', '+09:00');
    var d = new Date(s);
    if (isNaN(d.getTime())) return String(v);
    return d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  // 予約時刻の選択肢（15分単位・10:00〜22:00）
  function buildTimeOptions(selected) {
    var slots = [];
    for (var h = 10; h <= 22; h++) {
      for (var m = 0; m < 60; m += 15) {
        if (h === 22 && m > 0) continue;
        slots.push(pad2(h) + ':' + pad2(m));
      }
    }
    var sel = $('reservation-time-input');
    sel.innerHTML = '';
    if (selected && slots.indexOf(selected) === -1) slots.unshift(selected); // 過去データの変な時刻も表示できるように
    slots.forEach(function (t) {
      sel.insertAdjacentHTML('beforeend', '<option value="' + t + '">' + t + '</option>');
    });
    sel.value = selected || slots[0];
  }

  // 予約テーブルを、画面の絞り込み条件で表示する（絞り込みはブラウザ側で行う）
  function filterReservations() {
    var date = $('reservation-date').value || '';
    var storeId = $('reservation-store-filter').value || '';
    var status = $('reservation-status-filter').value || '';
    var tbody = $('reservations-tbody');
    tbody.innerHTML = '';

    var shown = 0, reserved = 0, visited = 0;
    currentReservations.forEach(function (r) {
      if (date && String(r.reservation_datetime).substring(0, 10) !== date) return;
      if (storeId && r.store_id !== storeId) return;
      if (status && r.status !== status) return;
      shown++;
      if (r.status === 'reserved') reserved++;
      if (r.status === 'visited') visited++;

      var actions =
        '<button type="button" class="btn small" data-act="edit" data-id="' + esc(r.reservation_id) + '">編集</button>';
      if (r.status === 'reserved') {
        actions += '<button type="button" class="btn small" data-act="visited" data-id="' + esc(r.reservation_id) + '">来店済み</button>' +
          '<button type="button" class="btn small" data-act="no_show" data-id="' + esc(r.reservation_id) + '">無断</button>';
      } else {
        actions += '<button type="button" class="btn small" data-act="reserved" data-id="' + esc(r.reservation_id) + '">予約済みへ戻す</button>';
      }
      if (r.status !== 'cancelled') {
        actions += '<button type="button" class="btn small danger" data-act="cancelled" data-id="' + esc(r.reservation_id) + '">キャンセル</button>';
      }
      actions += '<button type="button" class="btn small danger" data-act="delete" data-id="' + esc(r.reservation_id) + '">削除</button>';

      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + fmtDateTime(r.reservation_datetime) + '</td>' +
        '<td>' + esc(r.store_name || r.store_id) + '</td>' +
        '<td class="cell-nowrap">' + esc(r.customer_name) + '</td>' +
        '<td class="cell-nowrap">' + esc(r.phone || '') + '</td>' +
        '<td>' + esc(r.party_size) + '名</td>' +
        '<td class="cell-wrap">' + esc(r.notes || '') + '</td>' +
        '<td>' + (RES_STATUS_LABEL[r.status] || esc(r.status)) + '</td>' +
        '<td class="cell-actions">' + actions + '</td>';
      tbody.appendChild(tr);
    });

    $('reservations-stats').textContent = '表示 ' + shown + '件（予約済み ' + reserved + '／来店済み ' + visited + '）';
    $('reservations-empty').classList.toggle('hidden', shown > 0);
  }

  function renderReservations(payload) {
    currentReservations = (payload && payload.reservations) || [];
    filterReservations();
  }

  ['reservation-date', 'reservation-store-filter', 'reservation-status-filter'].forEach(function (id) {
    $(id).addEventListener('change', filterReservations);
  });

  $('btn-reservation-clear').addEventListener('click', function () {
    $('reservation-date').value = todayLocal();
    $('reservation-store-filter').value = '';
    $('reservation-status-filter').value = '';
    filterReservations();
  });

  $('reservations-tbody').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var id = btn.getAttribute('data-id');

    if (act === 'edit') {
      var r = currentReservations.filter(function (x) { return x.reservation_id === id; })[0];
      if (r) openReservationModal(r);
      return;
    }
    if (act === 'delete') {
      if (!confirm('予約（' + id + '）を削除します。履歴も消えます。よろしいですか？')) return;
      run('deleteReservation', { reservation_id: id }, function (res) {
        renderReservations(res);
        showToast(res.message || '削除しました。');
      });
      return;
    }
    run('setReservationStatus', { reservation_id: id, status: act }, function (res) {
      renderReservations(res);
      showToast(res.message || '更新しました。');
    });
  });

  // 予約モーダル用の店舗・顧客セレクトを用意する
  function fillReservationStoreSelects(stores) {
    var filter = $('reservation-store-filter');
    var modal = $('reservation-store');
    var keepF = filter.value, keepM = modal.value;
    filter.innerHTML = '<option value="">店舗: すべて</option>';
    modal.innerHTML = '';
    stores.forEach(function (s) {
      if (s.status !== 'active') return;
      filter.insertAdjacentHTML('beforeend', '<option value="' + esc(s.store_id) + '">' + esc(s.store_name) + '</option>');
      modal.insertAdjacentHTML('beforeend', '<option value="' + esc(s.store_id) + '">' + esc(s.store_name) + '</option>');
    });
    filter.value = keepF;
    modal.value = keepM;
  }

  function fillReservationCustomerSelect(customers) {
    ledgerCustomers = customers || [];
    var sel = $('reservation-customer');
    var keep = sel.value;
    sel.innerHTML = '<option value="">（台帳から選ばない）</option>';
    ledgerCustomers.forEach(function (c) {
      if (c.friend_status !== 'followed') return;
      sel.insertAdjacentHTML('beforeend', '<option value="' + esc(c.customer_id) + '">' + esc(c.display_name || c.customer_id) + '</option>');
    });
    sel.value = keep;
  }

  $('reservation-customer').addEventListener('change', function () {
    var id = $('reservation-customer').value;
    if (!id) return;
    var c = ledgerCustomers.filter(function (x) { return x.customer_id === id; })[0];
    if (c && c.display_name) $('reservation-name').value = c.display_name;
  });

  function openReservationModal(r) {
    $('reservation-modal-title').textContent = r ? '予約を編集（' + r.reservation_id + '）' : '予約を追加';
    $('reservation-id').value = r ? r.reservation_id : '';
    $('reservation-store').value = r ? r.store_id : ($('reservation-store').value || '');
    $('reservation-customer').value = r ? (r.customer_id || '') : '';
    $('reservation-name').value = r ? r.customer_name : '';
    $('reservation-phone').value = r ? (r.phone || '') : '';
    $('reservation-date-input').value = r ? String(r.reservation_datetime).substring(0, 10) : todayLocal();
    buildTimeOptions(r ? String(r.reservation_datetime).substring(11, 16) : '');
    $('reservation-party').value = r ? r.party_size : 2;
    $('reservation-notes').value = r ? (r.notes || '') : '';
    $('modal-reservation').classList.remove('hidden');
  }

  function closeReservationModal() { $('modal-reservation').classList.add('hidden'); }

  $('btn-new-reservation').addEventListener('click', function () { openReservationModal(null); });
  $('reservation-modal-cancel').addEventListener('click', closeReservationModal);
  $('modal-reservation').addEventListener('click', function (ev) {
    if (ev.target === $('modal-reservation')) closeReservationModal();
  });

  $('form-reservation').addEventListener('submit', function (ev) {
    ev.preventDefault();
    run('saveReservation', {
      reservation_id: $('reservation-id').value,
      store_id: $('reservation-store').value,
      customer_id: $('reservation-customer').value,
      customer_name: $('reservation-name').value,
      phone: $('reservation-phone').value,
      reservation_datetime: $('reservation-date-input').value + ' ' + $('reservation-time-input').value,
      party_size: $('reservation-party').value,
      notes: $('reservation-notes').value
    }, function (res) {
      closeReservationModal();
      // 保存した予約が見えるように、日付と状態の絞り込みを解除する
      $('reservation-date').value = '';
      $('reservation-status-filter').value = '';
      renderReservations(res);
      showToast(res.message || '保存しました。');
    });
  });

  // ---------- 初期表示 ----------

  run('getGroupSettings', {}, renderGroup);
  run('listStores', {}, function (stores) {
    renderStores(stores || []);
    fillReservationStoreSelects(stores || []);
  });
  run('getLineStatus', {}, renderLine);
  run('listCustomers', {}, function (payload) {
    renderCustomers(payload);
    fillReservationCustomerSelect((payload && payload.customers) || []);
  });
  $('reservation-date').value = todayLocal();
  run('listReservations', {}, renderReservations);

})();
</script>
