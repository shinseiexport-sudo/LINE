<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご予約</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #f4f2ee; color: #2a2622; padding: 16px 12px 40px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .hero { background: #f59b2d; border-radius: 16px; padding: 22px 18px; text-align: center; color: #fff; margin-bottom: 14px; }
  .hero h1 { font-size: 20px; letter-spacing: 1px; }
  .hero p { font-size: 12px; margin-top: 6px; opacity: .92; }
  .card { background: #fff; border-radius: 14px; padding: 18px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: bold; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input, textarea { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd6cc; border-radius: 10px; background: #fff; color: #2a2622; }
  textarea { height: 76px; resize: vertical; }
  .btn { width: 100%; margin-top: 20px; padding: 15px; font-size: 16px; font-weight: bold; color: #fff; background: #f59b2d; border: 0; border-radius: 12px; cursor: pointer; }
  .btn:disabled { background: #cbc4b8; cursor: not-allowed; }
  .btn-sub { width: 100%; margin-top: 10px; padding: 12px; font-size: 14px; color: #55504a; background: #efece6; border: 0; border-radius: 12px; cursor: pointer; }
  .msg { margin-top: 12px; font-size: 13px; color: #c0392b; text-align: center; }
  .hidden { display: none; }
  .center { text-align: center; font-size: 14px; color: #7a736a; }
  .done-title { font-size: 19px; font-weight: bold; color: #2a7a3d; text-align: center; margin-bottom: 10px; }
  .done-id { text-align: center; font-size: 15px; margin-bottom: 12px; }
  .done-id b { font-size: 18px; letter-spacing: 1px; }
  .done-detail { font-size: 14px; line-height: 1.9; color: #55504a; background: #faf8f4; border-radius: 10px; padding: 12px 14px; }
  .note { font-size: 11px; color: #9a938a; margin-top: 10px; line-height: 1.6; }
  .plain { font-size: 14px; line-height: 1.8; }
  #err-detail { font-size: 12px; color: #9a938a; margin-top: 10px; line-height: 1.6; word-break: break-all; }
  .hint-msg { margin-top: 6px; font-size: 12px; line-height: 1.6; }
  .hint-ok { color: #2a7a3d; }
  .hint-ng { color: #c0392b; font-weight: bold; }
  /* 日付カレンダー */
  .date-btn { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd6cc; border-radius: 10px; background: #fff; color: #2a2622; cursor: pointer; text-align: left; }
  .date-btn.empty { color: #9a938a; }
  .cal { margin-top: 8px; background: #fff; border: 1px solid #ddd6cc; border-radius: 12px; padding: 10px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .cal-title { font-size: 14px; font-weight: bold; }
  .cal-nav { border: 0; background: #efece6; color: #55504a; border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .cal-nav:disabled { opacity: .35; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal-dow { font-size: 11px; color: #9a938a; padding: 2px 0; }
  .cal-day { padding: 9px 0; border-radius: 8px; background: #f7f4ef; font-size: 14px; cursor: pointer; }
  .cal-day.off { background: #2a2622; color: #6f6960; cursor: default; } /* 黒＝予約できない日 */
  .cal-day.sel { background: #f59b2d; color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1 id="hero-title">ご予約フォーム</h1>
    <p>ご入力のうえ「予約を送信する」を押してください</p>
  </div>

  <div id="loading" class="card center">準備中です...</div>

  <div id="errorSetup" class="card hidden">
    <p class="plain" id="err-main">予約フォームを開けませんでした。</p>
    <p id="err-detail"></p>
    <button class="btn-sub" type="button" onclick="location.reload()">もう一度読み込む</button>
  </div>

  <form id="form" class="card hidden" onsubmit="return false;">
    <label>店舗</label>
    <select id="f-store"></select>

    <label>予約日</label>
    <div id="date-btn" class="date-btn" onclick="toggleCal()">タップして日付を選択</div>
    <input type="date" id="f-date" class="hidden">
    <div id="calendar" class="cal hidden"></div>
    <p id="date-hint" class="hint-msg hidden"></p>

    <label>時間</label>
    <select id="f-time"></select>

    <label>人数</label>
    <select id="f-party"></select>

    <label>お名前</label>
    <input type="text" id="f-name" placeholder="例: 山田 太郎">

    <label>電話番号</label>
    <input type="tel" id="f-phone" placeholder="例: 09012345678">

    <label>メモ（任意）</label>
    <textarea id="f-notes" placeholder="アレルギー、座席のご希望など"></textarea>

    <button class="btn" id="btn" type="button" onclick="submitReservation()">予約を送信する</button>
    <p id="msg" class="msg hidden"></p>
    <p class="note">送信後の変更・キャンセルは店舗までご連絡ください。</p>
  </form>

  <div id="done" class="card hidden">
    <p class="done-title">ご予約を受け付けました</p>
    <p class="done-id">予約番号 <b id="done-id"></b></p>
    <div id="done-detail" class="done-detail"></div>
  </div>
</div>

<script>
// ===== 設定（GitHub Pages版はここに直書きします） =====
var LIFF_ID = '2012203822-F8P4xz3m';
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxKLdgvye_g34TXQFopTr-S6E5FaFfGPmXCmSxoiXJqSxeaEC7akE0L85vmJdJFPY0KsA/exec';
var RESERVE_KEY = 'RZK-a7c3e91f5b28d046';

var profile_ = null;
var submitting_ = false;
var stores_ = []; // 店舗一覧（受付ルール付き）

window.addEventListener('load', init);

setTimeout(function () {
  if (!document.getElementById('loading').classList.contains('hidden')) {
    showError('読み込みに時間がかかっています。通信状態の良い場所でもう一度お試しください。');
  }
}, 15000);

function init() {
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) {
      showError('LINEの中から開いてください。お店から送られてきたリンクを、LINEのトーク内でタップしてください。');
      return;
    }
    return liff.getProfile().then(function (p) { profile_ = p; })
      .catch(function (err) { profile_ = null; })
      .then(function () { loadStores(); });
  }).catch(function (err) {
    showError('フォームの初期化に失敗しました。', err);
  });
}

// 店舗一覧をGASの公開APIから取得
function loadStores() {
  fetch(EXEC_URL + '?page=api&act=stores')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      var stores = (data && data.stores) || [];
      if (!data || !data.ok || stores.length === 0) {
        showError('予約できる店舗が登録されていません。店舗側の設定を確認してください。');
        return;
      }
      if (stores.length === 1) {
        document.getElementById('hero-title').textContent = stores[0].store_name + ' ご予約フォーム';
      }
      stores_ = stores;
      var sel = document.getElementById('f-store');
      stores.forEach(function (s) {
        var o = document.createElement('option');
        o.value = s.store_id;
        o.textContent = s.store_name;
        sel.appendChild(o);
      });
      startForm();
    })
    .catch(function (err) {
      showError('店舗一覧の取得に失敗しました。', err);
    });
}

function startForm() {
  if (profile_ && profile_.displayName) {
    document.getElementById('f-name').value = profile_.displayName;
  }
  buildTimes();
  buildParty();
  setMinDate();
  showCard('form');
}

// ===== 予約の受付ルール（選択した店舗の設定を使う。未設定なら既定値） =====
var DEFAULT_LEAD_MIN = 60; // 直前この分数は受付不可（店舗設定が空欄のとき）
var DEFAULT_MIN_DAYS = 0;  // この日数後以降のみ受付（店舗設定が空欄のとき）

// 選択中の店舗の受付ルール
function storeRules_() {
  var sel = document.getElementById('f-store');
  var s = stores_.filter(function (x) { return x.store_id === sel.value; })[0];
  function num(v, def) {
    var n = Number(v);
    return (v !== '' && v !== null && v !== undefined && !isNaN(n)) ? n : def;
  }
  return {
    lead: s ? num(s.reserve_lead_min, DEFAULT_LEAD_MIN) : DEFAULT_LEAD_MIN,
    days: s ? num(s.reserve_min_days, DEFAULT_MIN_DAYS) : DEFAULT_MIN_DAYS,
    open: (s && s.reserve_open_time) || '10:00',
    close: (s && s.reserve_close_time) || '22:00',
    stop: !!(s && s.reserve_stop === 'stop'),
    cap: (s && typeof s.reserve_capacity === 'number' && s.reserve_capacity > 0) ? s.reserve_capacity : 0,
    closed: (s && s.closed_dates) || [],
    full: (s && s.full_dates) || []
  };
}

// 日付選択の下限メッセージ（「○月○日以降のご予約をお願いします」など）
function weekdayJa_(d) { return ['日', '月', '火', '水', '木', '金', '土'][d.getDay()]; }
function updateDateHint() {
  var hint = document.getElementById('date-hint');
  if (!hint) return;
  var r = storeRules_();
  hint.className = 'hint-msg';
  if (r.stop) {
    hint.textContent = 'ただいま予約を受け付けておりません。店舗までご連絡ください。';
    hint.classList.add('hint-ng');
  } else if (r.days > 0) {
    var e = new Date();
    e.setDate(e.getDate() + r.days);
    hint.textContent = (e.getMonth() + 1) + '月' + e.getDate() + '日（' + weekdayJa_(e) + '）以降のご予約をお願いします';
    hint.classList.add('hint-ok');
  } else {
    hint.textContent = '';
    hint.classList.add('hidden');
    return;
  }
  hint.classList.remove('hidden');
}

// ===== 日付カレンダー（予約できない日は黒く塗って選べなくする） =====
var CAL_MONTH = null; // カレンダーに表示中の月（その月1日のDate）

// 最短受付日（"YYYY-MM-DD"）
function minDate_() { return earliestLocal_().slice(0, 10); }

function p2_(n) { return (n < 10 ? '0' : '') + n; }

// "2026-11-03" → 「11月3日（火）」
function fmtDateJa_(s) {
  var p = String(s).split('-');
  return Number(p[1]) + '月' + Number(p[2]) + '日（' + weekdayJa_(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]))) + '）';
}

// その日は予約できるか（true=黒く塗る）
function isBlackout_(dstr) {
  var r = storeRules_();
  if (r.stop) return true;                                    // 店舗が予約受付停止中
  if (dstr < minDate_()) return true;                         // 最短受付日より前
  if ((r.closed || []).indexOf(dstr) !== -1) return true;     // 店舗が指定した休業日
  if (r.cap > 0 && (r.full || []).indexOf(dstr) !== -1) return true; // 満席の日
  return false;
}

// 日付ボタンの表示をそろえる
function syncDateBtn_() {
  var d = document.getElementById('f-date');
  var b = document.getElementById('date-btn');
  if (!b || !d) return;
  if (d.value) { b.textContent = fmtDateJa_(d.value); b.classList.remove('empty'); }
  else { b.textContent = 'タップして日付を選択'; b.classList.add('empty'); }
}

function toggleCal() {
  var c = document.getElementById('calendar');
  if (!c) return;
  if (c.classList.contains('hidden')) {
    if (!CAL_MONTH) CAL_MONTH = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    renderCal();
    c.classList.remove('hidden');
  } else {
    c.classList.add('hidden');
  }
}

function shiftMonth_(n) {
  if (!CAL_MONTH) return;
  CAL_MONTH = new Date(CAL_MONTH.getFullYear(), CAL_MONTH.getMonth() + n, 1);
  renderCal();
}

// minMonth（"YYYY-MM"）のnヶ月後（"YYYY-MM"）
function addMonthsStr_(ym, n) {
  var d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1);
  return d.getFullYear() + '-' + p2_(d.getMonth() + 1);
}

// カレンダーを描き直す
function renderCal() {
  var c = document.getElementById('calendar');
  if (!c || !CAL_MONTH) return;
  var minMonth = minDate_().slice(0, 7);
  var thisY = CAL_MONTH.getFullYear(), thisM = CAL_MONTH.getMonth();
  var prevD = new Date(thisY, thisM - 1, 1), nextD = new Date(thisY, thisM + 1, 1);
  var prevStr = prevD.getFullYear() + '-' + p2_(prevD.getMonth() + 1);
  var nextStr = nextD.getFullYear() + '-' + p2_(nextD.getMonth() + 1);
  var html = '<div class="cal-head">'
    + '<button type="button" class="cal-nav" onclick="shiftMonth_(-1)"' + (prevStr < minMonth ? ' disabled' : '') + '>前へ</button>'
    + '<span class="cal-title">' + (thisM + 1) + '月</span>'
    + '<button type="button" class="cal-nav" onclick="shiftMonth_(1)"' + (nextStr > addMonthsStr_(minMonth, 2) ? ' disabled' : '') + '>次へ</button>'
    + '</div>';
  html += '<div class="cal-grid">';
  ['日', '月', '火', '水', '木', '金', '土'].forEach(function (w) { html += '<div class="cal-dow">' + w + '</div>'; });
  var startDow = new Date(thisY, thisM, 1).getDay();
  for (var i = 0; i < startDow; i++) html += '<div></div>';
  var daysInMonth = new Date(thisY, thisM + 1, 0).getDate();
  var cur = val('f-date');
  for (var day = 1; day <= daysInMonth; day++) {
    var dstr = thisY + '-' + p2_(thisM + 1) + '-' + p2_(day);
    if (isBlackout_(dstr)) {
      html += '<div class="cal-day off">' + day + '</div>';
    } else {
      html += '<div class="cal-day' + (dstr === cur ? ' sel' : '') + '" onclick="pickDate_(\'' + dstr + '\')">' + day + '</div>';
    }
  }
  html += '</div>';
  c.innerHTML = html;
}

function pickDate_(dstr) {
  document.getElementById('f-date').value = dstr;
  syncDateBtn_();
  toggleCal();
  buildTimes();
}

// 受付ルールで最も早い日時（"yyyy-MM-dd HH:mm"・端末の日本時間）
function earliestLocal_() {
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  var r = storeRules_();
  var d = new Date();
  d.setMinutes(d.getMinutes() + r.lead);
  if (r.days > 0) {
    var e = new Date();
    e.setDate(e.getDate() + r.days);
    e.setHours(0, 0, 0, 0);
    if (e.getTime() > d.getTime()) d = e;
  }
  return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
}

// 時間の選択肢（営業時間内を15分刻みで表示。受付ルール外の時間はグレーで選べない）
function buildTimes() {
  var sel = document.getElementById('f-time');
  var cur = sel.value;
  sel.innerHTML = '';
  var empty = document.createElement('option');
  empty.value = '';
  empty.textContent = '選択してください';
  sel.appendChild(empty);
  var earliest = earliestLocal_();
  var dateStr = val('f-date');
  var rules = storeRules_();
  if (rules.stop) { updateDateHint(); return; }
  for (var h = 0; h <= 23; h++) {
    [0, 15, 30, 45].forEach(function (m) {
      var v = (h < 10 ? '0' + h : h) + ':' + (m === 0 ? '00' : m);
      if (v < rules.open || v > rules.close) return; // 営業時間外は表示しない
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      if (dateStr && (dateStr + ' ' + v) <= earliest) o.disabled = true;
      sel.appendChild(o);
    });
  }
  updateDateHint();
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === cur && !sel.options[i].disabled) { sel.value = cur; break; }
  }
}

function buildParty() {
  var sel = document.getElementById('f-party');
  sel.innerHTML = '';
  for (var i = 1; i <= 12; i++) {
    var o = document.createElement('option');
    o.value = String(i);
    o.textContent = i + '名';
    sel.appendChild(o);
  }
}

// 予約日の初期値・下限を受付ルールに合わせる（日本時間）。店舗を変えたらやり直す
function applyDateMin() {
  var d = document.getElementById('f-date');
  var min = minDate_();
  d.min = min;
  if (d.value && (d.value < min || isBlackout_(d.value))) d.value = min;
  syncDateBtn_();
}

function setMinDate() {
  var d = document.getElementById('f-date');
  d.min = minDate_();
  d.value = d.min;
  syncDateBtn_();
  buildTimes();
  d.addEventListener('change', function () { syncDateBtn_(); buildTimes(); });
  document.getElementById('f-store').addEventListener('change', function () {
    applyDateMin();
    buildTimes();
  });
}

function val(id) {
  var el = document.getElementById(id);
  return el ? el.value.replace(/^\s+|\s+$/g, '') : '';
}

function showCard(id) {
  ['loading', 'form', 'done', 'errorSetup'].forEach(function (n) {
    document.getElementById(n).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
}

function showError(main, err) {
  document.getElementById('err-main').textContent = main;
  document.getElementById('err-detail').textContent =
    err && err.message ? '（' + err.message + '）' : '';
  showCard('errorSetup');
}

function fail(m) {
  submitting_ = false;
  var btn = document.getElementById('btn');
  btn.disabled = false;
  btn.textContent = '予約を送信する';
  var msg = document.getElementById('msg');
  msg.textContent = m;
  msg.classList.remove('hidden');
}

function submitReservation() {
  if (submitting_) return;

  var storeSel = document.getElementById('f-store');
  var partySel = document.getElementById('f-party');
  var storeName = storeSel.options[storeSel.selectedIndex] ? storeSel.options[storeSel.selectedIndex].textContent : '';
  var partyText = partySel.options[partySel.selectedIndex] ? partySel.options[partySel.selectedIndex].textContent : '';

  var input = {
    key: RESERVE_KEY,
    lineUserId: profile_ ? String(profile_.userId || '') : '',
    lineName: profile_ ? String(profile_.displayName || '') : '',
    store_id: val('f-store'),
    date: val('f-date'),
    time: val('f-time'),
    party_size: val('f-party'),
    customer_name: val('f-name'),
    phone: val('f-phone'),
    notes: val('f-notes')
  };

  if (!input.lineUserId) { fail('LINEの情報を取得できませんでした。リンクを開き直してください。'); return; }
  if (!input.store_id) { fail('店舗を選択してください。'); return; }
  if (!input.date) { fail('予約日を選択してください。'); return; }
  if (!input.time) { fail('時間を選択してください。'); return; }
  if (!input.customer_name) { fail('お名前を入力してください。'); return; }
  if (input.phone && !/^[0-9\-+()]{10,17}$/.test(input.phone)) { fail('電話番号の形式を確認してください（例: 09012345678）。'); return; }

  // 受付ルールの最終チェック（早すぎる日時は送らせない）
  var earliest = earliestLocal_();
  if ((input.date + ' ' + input.time) <= earliest) { fail('ご予約は ' + earliest + ' 以降の日時でお願いいたします。'); return; }

  if (storeRules_().stop) { fail('ただいま予約を受け付けておりません。店舗までご連絡ください。'); return; }
  if ((storeRules_().closed || []).indexOf(input.date) !== -1) { fail('ご指定の日は休業日です。別の日程でお願いいたします。'); return; }

  submitting_ = true;
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = '送信中...';
  document.getElementById('msg').classList.add('hidden');

  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 60000) : null;

  // GETで送信します（GASへのブラウザPOSTはリダイレクトの仕様で壊れるため）
  fetch(EXEC_URL + '?page=api&act=reserve&d=' + encodeURIComponent(JSON.stringify(input)), {
    method: 'GET',
    signal: ctrl ? ctrl.signal : undefined
  }).then(function (res) {
    return res.json();
  }).then(function (data) {
    if (!data || !data.ok) {
      throw new Error(data && data.message ? data.message : '送信に失敗しました。');
    }
    showCard('done');
    document.getElementById('done-id').textContent = data.reservation_id || '';
    document.getElementById('done-detail').textContent =
      storeName + '／' + input.date + ' ' + input.time + '／' + partyText;
  }).catch(function (err) {
    if (err && err.name === 'AbortError') {
      fail('時間切れになりました。通信状態の良い場所でもう一度お試しください。');
    } else if (err && err.message && err.message.indexOf('Failed to fetch') !== -1) {
      fail('通信に失敗しました。電波の良い場所でもう一度お試しください。');
    } else {
      fail(err && err.message ? err.message : '送信に失敗しました。');
    }
  }).then(function () {
    if (timer) clearTimeout(timer);
  });
}
</script>
</body>
</html>
