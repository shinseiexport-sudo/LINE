<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クーポン</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* チケット風デザイン：切り取り線＋丸い切り欠き。色は温かいコーラル〜ピンク */
  :root { --bg:#fff4ec; --paper:#ffffff; --ink:#3b2a24; --muted:#9a8378; --coral:#ff6f4f; --pink:#ff8fa8; --cream:#fff9f3; --line:#f3d9cc; --off:#cbbfb8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); padding: 14px 14px 40px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 460px; margin: 0 auto; }
  .hero { position: relative; overflow: hidden; background: linear-gradient(135deg, var(--coral), var(--pink)); border-radius: 22px; padding: 22px 18px 20px; color: #fff; margin-bottom: 12px; box-shadow: 0 6px 18px rgba(255,111,79,.25); }
  .hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.18); }
  .hero::before { width: 120px; height: 120px; right: -30px; top: -40px; }
  .hero::after { width: 70px; height: 70px; right: 70px; bottom: -35px; }
  .hero-kicker { font-size: 11px; letter-spacing: .3em; font-weight: 800; opacity: .9; }
  .hero h1 { font-size: 24px; font-weight: 800; margin-top: 2px; }
  .hero p { font-size: 12px; margin-top: 6px; opacity: .95; }
  .warn { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border: 2px solid var(--coral); border-radius: 16px; padding: 12px 14px; margin-bottom: 8px; }
  .warn-icon { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--coral); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .warn-big { color: var(--coral); font-size: 15px; font-weight: 800; line-height: 1.5; }
  .warn-small { color: var(--ink); font-size: 12px; margin-top: 2px; }
  .sec { font-size: 15px; font-weight: 800; margin: 22px 2px 10px; display: flex; align-items: center; gap: 8px; }
  .sec::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
  .ticket { position: relative; background: var(--paper); border-radius: 18px; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(59,42,36,.08); overflow: hidden; }
  .ticket img { width: 100%; display: block; aspect-ratio: 1.6 / 1; object-fit: cover; }
  .t-top { padding: 14px 16px 12px; }
  .t-kicker { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .2em; color: var(--coral); background: #ffe9e2; border-radius: 99px; padding: 2px 9px; }
  .t-name { font-size: 16px; font-weight: 800; margin-top: 6px; line-height: 1.4; }
  .t-note { font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .t-period { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .t-perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin: 0 14px; }
  .t-perf::before, .t-perf::after { content: ''; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
  .t-perf::before { left: -26px; } .t-perf::after { right: -26px; }
  .t-bottom { padding: 12px 16px 16px; background: var(--cream); }
  .t-benefit { font-size: 30px; font-weight: 800; color: var(--coral); line-height: 1.15; letter-spacing: .01em; }
  .t-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .t-sub s { color: var(--off); }
  .t-btns { margin-top: 12px; }
  .btn { width: 100%; padding: 14px; font: inherit; font-size: 16px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--coral), var(--pink)); border: 0; border-radius: 99px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,111,79,.3); }
  .btn:disabled { background: var(--off); box-shadow: none; cursor: not-allowed; }
  .get-btn { width: 100%; padding: 12px; font: inherit; font-size: 15px; font-weight: 800; color: var(--coral); background: #fff; border: 2px solid var(--coral); border-radius: 99px; cursor: pointer; }
  .ticket.is-off { filter: grayscale(.7); opacity: .8; }
  .ticket.is-off .t-benefit { color: var(--muted); }
  .ticket.is-new::after { content: 'NEW'; position: absolute; top: 12px; right: 12px; font-size: 10px; font-weight: 800; letter-spacing: .1em; color: #fff; background: var(--pink); border-radius: 99px; padding: 3px 9px; }
  .used-row { background: var(--paper); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .used-row > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .used-badge { color: #fff; background: var(--off); border-radius: 99px; padding: 2px 9px; font-size: 11px; font-weight: 700; }
  .msg { margin: 10px 0; font-size: 13px; color: #c0392b; text-align: center; }
  .hidden { display: none; }
  .center { text-align: center; font-size: 14px; color: var(--muted); line-height: 1.8; background: var(--paper); border-radius: 16px; padding: 18px; }
  .empty { font-size: 13px; color: var(--muted); background: var(--paper); border: 2px dashed var(--line); border-radius: 16px; padding: 16px; text-align: center; line-height: 1.7; }
  .show-banner { background: linear-gradient(135deg, var(--coral), var(--pink)); color: #fff; font-size: 21px; font-weight: 800; text-align: center; border-radius: 18px; padding: 16px 12px 12px; margin-bottom: 14px; }
  .show-clock { display: block; font-size: 13px; font-weight: 700; margin-top: 4px; opacity: .95; letter-spacing: .05em; }
  .stamp { position: absolute; right: 16px; bottom: 18px; transform: rotate(-12deg); border: 3px solid #e2483d; color: #e2483d; border-radius: 12px; padding: 4px 12px; font-weight: 800; font-size: 20px; text-align: center; line-height: 1.1; background: rgba(255,255,255,.85); }
  .stamp small { display: block; font-size: 10px; font-weight: 700; }
  @media (prefers-reduced-motion: no-preference) { .stamp { animation: stampIn .35s ease-out both; } @keyframes stampIn { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } to { transform: rotate(-12deg) scale(1); opacity: 1; } } }
  .used-note { text-align: center; font-size: 13px; color: var(--muted); margin: 6px 0; }
  .btn2 { width: 100%; margin-top: 10px; padding: 13px; font: inherit; font-size: 15px; font-weight: 800; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 99px; cursor: pointer; }
  .mdl-bg { position: fixed; inset: 0; background: rgba(59,42,36,.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .mdl { background: #fff; border-radius: 22px; width: 100%; max-width: 360px; padding: 22px 18px 18px; text-align: center; }
  .mdl-title { font-size: 17px; font-weight: 800; color: var(--ink); margin-bottom: 10px; line-height: 1.5; }
  .mdl-text { font-size: 14px; color: var(--coral); font-weight: 700; line-height: 1.6; margin-bottom: 16px; white-space: pre-line; }
  .mdl-btns { display: flex; gap: 8px; }
  .mdl-btns button { flex: 1; padding: 13px; font: inherit; font-size: 15px; font-weight: 800; border: 0; border-radius: 99px; cursor: pointer; }
  .mdl-bg.hidden { display: none; } /* 非表示を確実に効かせる */
  .mdl-no { background: #f3ebe6; color: var(--ink); }
  .mdl-yes { background: linear-gradient(135deg, var(--coral), var(--pink)); color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-kicker">COUPON</div>
    <h1>クーポン</h1>
    <p>お会計の際にクーポンをご提示ください</p>
  </div>

  <div class="warn">
    <div class="warn-icon">!</div>
    <div>
      <div class="warn-big">お会計のときに、スタッフの前で表示してください</div>
      <div class="warn-small">「クーポンを表示する」を押すと使用済みになります。</div>
    </div>
  </div>

  <div id="cmsg" class="msg hidden"></div>

  <div id="list-area">
    <h2 class="sec" id="sec-mine">使えるクーポン</h2>
    <div id="mine"></div>
    <h2 class="sec" id="sec-avail">受け取れるクーポン</h2>
    <div id="avail"></div>
    <div id="used-block" class="hidden">
      <h2 class="sec">使い終わった・期限切れのクーポン</h2>
      <div id="used"></div>
    </div>
  </div>

  <div id="show-area" class="hidden">
    <div class="show-banner">スタッフにご提示ください<span class="show-clock" id="show-clock"></span></div>
    <div id="show-ticket"></div>
    <div class="used-note">このクーポンは使用済みになりました。</div>
    <button type="button" class="btn2" onclick="backToList()">とじる</button>
  </div>
</div>

<script>
// GitHub Pages版（LIFFのエンドポイントはこのページのURLにする）
// LIFF IDはGASのスクリプトプロパティ LIFF_COUPON_ID から自動で読むので、このファイルは書き換え不要
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxKLdgvye_g34TXQFopTr-S6E5FaFfGPmXCmSxoiXJqSxeaEC7akE0L85vmJdJFPY0KsA/exec';
var LIFF_ID = '';
var API_KEY = '';

var profile_ = null;
var initOk_ = false, inClient_ = false;

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function showMsg(m) { var el = $('cmsg'); el.textContent = m; el.classList.remove('hidden'); }

function benefitText(c) {
  if (c.benefit_type === 'discount') {
    if (c.price_before > 0) {
      var after = c.discount_yen > 0 ? (c.price_before - c.discount_yen) : Math.round(c.price_before * (100 - c.discount_percent) / 100);
      after = Math.max(0, after);
      return '¥' + c.price_before.toLocaleString('ja-JP') + ' → ¥' + after.toLocaleString('ja-JP') + '（' + (c.discount_yen > 0 ? '¥' + c.discount_yen.toLocaleString('ja-JP') + '引き' : c.discount_percent + '%引き') + '）';
    }
    return c.discount_yen > 0 ? '¥' + c.discount_yen.toLocaleString('ja-JP') + '引き' : c.discount_percent + '%引き';
  }
  var t = ({ free: '無料', cashback: 'キャッシュバック', present: 'プレゼント', other: '特典' })[c.benefit_type] || '特典';
  return t + (c.notes ? '：' + c.notes : '');
}
function periodText(c) {
  if (c.no_limit) return '期限なし';
  var f = c.valid_from ? String(c.valid_from).slice(0, 10) : '';
  var u = c.valid_until ? String(c.valid_until).slice(0, 10) : '';
  if (f && u) return f + ' 〜 ' + u;
  if (f) return f + ' から';
  if (u) return u + ' まで';
  return '';
}
// 大きく見せる特典（例：15%OFF）と、小さく添える補足（例：¥1,000 → ¥850）に分ける
function benefitParts(c) {
  if (c.benefit_type === 'discount') {
    var big = c.discount_yen > 0 ? '¥' + Number(c.discount_yen).toLocaleString('ja-JP') + ' OFF' : c.discount_percent + '% OFF';
    var sub = '';
    if (c.price_before > 0) {
      var after = c.discount_yen > 0 ? (c.price_before - c.discount_yen) : Math.round(c.price_before * (100 - c.discount_percent) / 100);
      after = Math.max(0, after);
      sub = '<s>¥' + Number(c.price_before).toLocaleString('ja-JP') + '</s> → ¥' + after.toLocaleString('ja-JP');
    }
    return { big: big, sub: sub };
  }
  var label = ({ free: '無料', cashback: 'キャッシュバック', present: 'プレゼント', other: '特典' })[c.benefit_type] || '特典';
  return { big: label, sub: '' };
}
function ticketHtml(c) {
  var b = benefitParts(c);
  var per = periodText(c);
  return '<div class="t-top">' +
      '<span class="t-kicker">COUPON</span>' +
      '<div class="t-name">' + esc(c.coupon_name) + '</div>' +
      (c.notes ? '<div class="t-note">' + esc(c.notes) + '</div>' : '') +
      (per ? '<div class="t-period">有効期限：' + esc(per) + '</div>' : '') +
    '</div>' +
    '<div class="t-perf"></div>' +
    '<div class="t-bottom"><div class="t-benefit">' + esc(b.big) + '</div>' +
      (b.sub ? '<div class="t-sub">' + b.sub + '</div>' : '');
}
function ticketCard(c, btnHtml, cls) {
  return '<div class="ticket' + (cls ? ' ' + cls : '') + '">' +
    (c.image_url ? '<img src="' + esc(c.image_url) + '" alt="" onerror="this.style.display=\'none\'">' : '') +
    ticketHtml(c) + (btnHtml ? '<div class="t-btns">' + btnHtml + '</div>' : '') + '</div></div>';
}
function api(act, data, cb) {
  fetch(EXEC_URL + '?page=api&act=' + act + '&d=' + encodeURIComponent(JSON.stringify(data)))
    .then(function (r) { return r.json(); })
    .then(function (d) { cb(d); })
    .catch(function (e) { showing_ = false; showMsg('通信に失敗しました。もう一度お試しください。（' + e + '）'); });
}

function loadHome() {
  api('couponHome', { key: API_KEY, lineUserId: profile_.userId }, function (d) {
    if (!d || !d.ok) { showMsg((d && d.message) || '読み込みに失敗しました。'); return; }
    var mine = $('mine'), avail = $('avail'), used = $('used');
    mine.innerHTML = ''; avail.innerHTML = ''; used.innerHTML = '';
    if (!d.registered) {
      $('sec-avail').classList.add('hidden');
      $('used-block').classList.add('hidden');
      mine.innerHTML = '<p class="center">まずはアンケートにご回答ください。<br>回答後からクーポンが使えるようになります。</p>';
      return;
    }
    // 使えるクーポン
    // 期限切れのクーポンは「使えるクーポン」に出さず、下の「使い終わった・期限切れのクーポン」へ移す
    var expired = d.mine.filter(function (it) { return it.block && it.block.indexOf('過ぎて') >= 0; });
    var mineList = d.mine.filter(function (it) { return !(it.block && it.block.indexOf('過ぎて') >= 0); });
    mineList.sort(function (a, b) { return (a.block ? 1 : 0) - (b.block ? 1 : 0); }); // 今使えるものを上に
    if (!mineList.length) mine.innerHTML = '<p class="empty">使えるクーポンはまだありません。下の「受け取れるクーポン」から受け取れます。</p>';
    mineList.forEach(function (item) {
      var div = document.createElement('div');
      div.innerHTML = item.block
        ? ticketCard(item.coupon, '<button type="button" class="btn" disabled>' + (item.block.indexOf('過ぎて') >= 0 ? '期限切れです' : 'まだ使えません') + '</button><div class="t-sub" style="margin-top:6px;">' + esc(item.block) + '</div>', 'is-off')
        : ticketCard(item.coupon, '<button type="button" class="btn" data-cc="' + esc(item.cc_id) + '">クーポンを表示する</button>');
      mine.appendChild(div);
    });
    // 受け取れるクーポン
    if (!d.available.length) { $('sec-avail').classList.add('hidden'); }
    else {
      $('sec-avail').classList.remove('hidden');
      d.available.forEach(function (c) {
        var div = document.createElement('div');
        div.innerHTML = ticketCard(c, '<button type="button" class="get-btn" data-cp="' + esc(c.coupon_id) + '">受け取る</button>', 'is-new');
        avail.appendChild(div);
      });
    }
    // メッセージから開いた場合：そのクーポンの確認ポップアップをすぐ出す（やめる→メッセージ画面に戻る）
    if (!autoAsked_) {
      autoAsked_ = true;
      var cpLink = linkCouponId_();
      if (cpLink) {
        var hit = d.mine.filter(function (it) { return String(it.coupon.coupon_id) === cpLink && !it.block; })[0];
        if (hit) showCoupon(hit.cc_id, closeToTalk_);
      }
    }
    // 使い終わったクーポン
    if (!d.used.length && !expired.length) { $('used-block').classList.add('hidden'); }
    else {
      $('used-block').classList.remove('hidden');
      d.used.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'used-row';
        div.innerHTML = '<span>' + esc(item.coupon.coupon_name) + '</span><span><span class="used-badge">使用済み</span> ' + esc(String(item.used_at || '').slice(0, 16)) + '</span>';
        used.appendChild(div);
      });
      expired.forEach(function (item) {
        var div = document.createElement('div');
        div.className = 'used-row';
        div.innerHTML = '<span>' + esc(item.coupon.coupon_name) + '</span><span><span class="used-badge">期限切れ</span> ' + esc(periodText(item.coupon)) + '</span>';
        used.appendChild(div);
      });
    }
  });
}

// 確認・お知らせ用のポップアップ（confirm/alertだとURLが上に出るため自作）
function popup_(title, text, okLabel, cancelLabel, onOk, onCancel) {
  $('mdl-title').textContent = title;
  $('mdl-text').textContent = text || '';
  $('mdl-yes').textContent = okLabel || 'OK';
  $('mdl-no').textContent = cancelLabel || '';
  $('mdl-no').style.display = cancelLabel ? '' : 'none';
  $('mdl').classList.remove('hidden');
  $('mdl-yes').onclick = function () { $('mdl').classList.add('hidden'); if (onOk) onOk(); };
  $('mdl-no').onclick = function () { $('mdl').classList.add('hidden'); if (onCancel) onCancel(); };
}
var showing_ = false; // 二度押し防止
function showCoupon(ccId, onCancel) {
  if (showing_) return;
  popup_('お会計の際にクーポンをご提示ください', 'クーポンを表示すると使用済になりますのでご注意下さい。', '表示する', 'やめる', function () { doShowCoupon_(ccId); }, onCancel);
}
// メッセージ画面に戻る（LINEの中ならページを閉じる）
function closeToTalk_() {
  try { if (typeof liff !== 'undefined' && liff.isInClient()) { liff.closeWindow(); return; } } catch (e) {}
  // LINEの外で開いた場合は閉じられないので一覧のまま
}
// メッセージのクーポンカードから開いたときの「?cp=CP0001」を取り出す
function linkCouponId_() {
  try {
    var q = new URLSearchParams(location.search);
    var cp = q.get('cp');
    if (!cp && q.get('liff.state')) cp = new URLSearchParams(q.get('liff.state').replace(/^[^?]*\?/, '')).get('cp');
    return cp || '';
  } catch (e) { return ''; }
}
var autoAsked_ = false; // 自動ポップアップは開いた直後の1回だけ
function doShowCoupon_(ccId) {
  showing_ = true;
  api('couponShow', { key: API_KEY, lineUserId: profile_.userId, ccId: ccId }, function (d) {
    showing_ = false;
    if (!d || !d.ok) { popup_('クーポンを表示できません', (d && d.message) || 'エラーが発生しました。', 'OK', '', loadHome); return; }
    if (!d.used_now) { popup_('このクーポンは使用済みです', 'すでに一度表示されたため、もう使えません（お一人様1回まで）。', 'OK', '', loadHome); return; }
    if (!d.coupon) { showMsg('クーポンの内容を読み込めませんでした。'); return; }
    var nowD = new Date();
    var pad = function (n) { return ('0' + n).slice(-2); };
    $('show-ticket').innerHTML = ticketCard(d.coupon, '').replace(/<\/div>$/, '<div class="stamp">使用済<small>' + (nowD.getMonth() + 1) + '/' + nowD.getDate() + ' ' + pad(nowD.getHours()) + ':' + pad(nowD.getMinutes()) + '</small></div></div>');
    startShowClock_();
    $('list-area').classList.add('hidden');
    $('show-area').classList.remove('hidden');
    window.scrollTo(0, 0);
  });
}

function receiveCoupon(cpId) {
  api('couponGet', { key: API_KEY, lineUserId: profile_.userId, couponId: cpId }, function (d) {
    if (!d || !d.ok) { popup_('受け取れませんでした', (d && d.message) || '', 'OK', '', loadHome); return; }
    loadHome();
  });
}

// 表示中は今の時刻を秒まで動かす（画面のスクリーンショットの使い回し防止）
var clockTimer_ = null;
function startShowClock_() {
  var el = $('show-clock');
  var tick = function () {
    var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
    el.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  };
  tick();
  if (clockTimer_) clearInterval(clockTimer_);
  clockTimer_ = setInterval(tick, 1000);
}
function backToList() {
  if (clockTimer_) { clearInterval(clockTimer_); clockTimer_ = null; }
  $('show-area').classList.add('hidden');
  $('list-area').classList.remove('hidden');
  loadHome();
}

// ボタンのクリック（作り直しても消えないように委譲で受ける）
document.addEventListener('click', function (ev) {
  var t = ev.target;
  while (t && t !== document) {
    if (t.hasAttribute && t.hasAttribute('data-cc')) { showCoupon(t.getAttribute('data-cc')); return; }
    if (t.hasAttribute && t.hasAttribute('data-cp')) { receiveCoupon(t.getAttribute('data-cp')); return; }
    t = t.parentNode;
  }
});

// 起動: LINEと接続して本人を特定してからクーポンを読む（アンケートページと同じ方式）
function retriedOnce_() { try { return window.sessionStorage.getItem('coupon_retried') === '1'; } catch (e) { return false; } }
function markRetried_() { try { window.sessionStorage.setItem('coupon_retried', '1'); } catch (e) {} }

function startLiff_() {
  if (!LIFF_ID) {
    showMsg('【準備中】クーポンページの公開設定がまだです。お店の担当者がLIFF ID（LIFF_COUPON_ID）を設定するまでお待ちください。');
  } else if (typeof liff === 'undefined') {
    showMsg('【A】LINEとの接続部の読み込みに失敗しました。電波の良い場所でもう一度開いてください。');
  } else {
    liff.init({ liffId: LIFF_ID }).then(function () {
      initOk_ = true;
      if (!liff.isInClient()) { inClient_ = false; return null; }
      inClient_ = true;
      return liff.getProfile().then(function (p) { profile_ = p; }).catch(function (e) {
        try {
          var tk = liff.getDecodedIDToken();
          if (tk && tk.sub) { profile_ = { userId: tk.sub, displayName: tk.name || '' }; return null; }
        } catch (e2) { /* 次へ */ }
        if (!retriedOnce_()) { markRetried_(); liff.login(); return null; }
        showMsg('【B】プロフィール取得に失敗しました。（' + e + '）');
        return null;
      }).then(function () {
        if (profile_) loadHome();
        return null;
      });
    }).catch(function (e) {
      showMsg('【C】LINEとの接続に失敗しました。もう一度開き直してください。（' + e + '）');
    });
  }
}

// 起動: まずGASから設定（LIFF ID・送信キー）を読む → LINEと接続
var cfgDone_ = false;
fetch(EXEC_URL + '?page=api&act=couponConfig')
  .then(function (r) { return r.json(); })
  .then(function (d) {
    cfgDone_ = true;
    if (!d || !d.ok) { showMsg('【E】設定を読み込めませんでした。（' + ((d && d.message) || '') + '）'); return; }
    LIFF_ID = d.liff_id || '';
    API_KEY = d.key || '';
    startLiff_();
  })
  .catch(function (e) { cfgDone_ = true; showMsg('【E】設定を読み込めませんでした。電波の良い場所でもう一度開いてください。（' + e + '）'); });

setTimeout(function () {
  if (profile_) return;
  if (document.getElementById('cmsg').textContent.indexOf('【E】') === 0) return;
  if (!cfgDone_) { showMsg('【D0】設定の読み込みが終わりません。電波の良い場所でもう一度開いてください。'); return; }
  if (!LIFF_ID || document.getElementById('cmsg').textContent.indexOf('【準備中】') === 0) return;
  if (!initOk_) showMsg('【D1】LINEとの接続が固まっています（init待ち）');
  else if (!inClient_) showMsg('【D2】LINEの外として開かれています。LINEの中から開いてください。');
  else showMsg('【D3】LINEとの接続は出来ていますが、プロフィールが取れていません');
}, 8000);
</script>

    <div class="mdl-title" id="mdl-title"></div>
    <div class="mdl-text" id="mdl-text"></div>
    <div class="mdl-btns">
      <button type="button" class="mdl-no" id="mdl-no">やめる</button>
      <button type="button" class="mdl-yes" id="mdl-yes">表示する</button>
    </div>
  </div>
</div>
</body>
</html>
